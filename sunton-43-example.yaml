esphome:
  name: sunton-43-test
  friendly_name: Sunton 4.3" Test
  # name_add_mac_suffix: true   # one image on several panels -- see the README

substitutions:
  home_page: lighting_1
  # the sleep clock sized for this canvas -- uncomment with sleep_clock below
  # sleep_clock_card_width: "102"
  # sleep_clock_card_height: "168"
  # sleep_clock_card_gap: "8"
  # sleep_clock_pair_gap: "24"
  # sleep_clock_digit_size: "132"

packages:
  common: !include common.yaml
  device: !include devices/ESP32-8048S043.yaml
  layout: !include layouts/800x480.yaml
  # pages, in navigation order -- or every page at once:
  # pages: !include layouts/800x480/all.yaml
  lighting_1: !include layouts/800x480/pages/lighting_1.yaml
  lighting_2: !include layouts/800x480/pages/lighting_2.yaml
  # climate: !include layouts/800x480/pages/climate.yaml  # thermostat and number steppers
  printers: !include layouts/800x480/pages/printers.yaml
  # optional features -- list them after layout:
  # idle: !include features/idle/idle.yaml       # dim, go home and sleep when idle
  # ceiling: !include features/idle/sun.yaml     # brightness follows the sun
  # memory: !include features/diagnostics/memory.yaml  # heap and loop-time sensors
  # psram: !include features/diagnostics/psram.yaml    # PSRAM free
  # ble_proxy: !include features/ble_proxy/ble_proxy.yaml  # Bluetooth proxy for HA -- see the README first
  # sleep_clock: !include features/sleep_clock/sleep_clock.yaml  # a split-flap clock instead of going dark; needs idle
