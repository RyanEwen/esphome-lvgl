esphome:
  name: elecrow-35-example
  friendly_name: CrowPanel 3.5" Example
  # name_add_mac_suffix: true   # one image on several panels -- see docs/classic-layouts.md

# Deprecated board: too slow for the full layout (layouts/ui), so it runs the simple one
# with a page of lights. See docs/classic-layouts.md.

substitutions:
