# Sunton 4.3" ESP32-8048S043: 800x480 RGB panel, run portrait (LVGL rotates the 480x800 canvas).
# A panel config includes this one file for the board: the hardware, the layout's sizes
# for its screen, and the Cameras page that suits it. Adding a board: see docs/boards.md.

packages:
  device: !include ../devices/ESP32-8048S043.yaml
  size: !include ../layouts/ui/sizes/480x800.yaml
  cameras: !include ../layouts/ui/pages/cameras.yaml
