# The base of the panel layout, at any size: fonts, theme, the header and tab bar, the
# pop-ups, and the Home page plumbing. Included by layouts/ui/layout.yaml (which is what a
# panel config includes); sizes come from the board (boards/ -> ui/sizes/<WxH>.yaml).

esphome:
  includes:
    - ../widgets/parts/printers/tray_color.h # the 3D-printer tiles' tray colours (widgets/printers)
  # Go home once everything is set up, rather than from splash's on_load: a
  # page.show inside the first page's own load event is dropped, and splash is
  # only the first page while no package adds one ahead of it.
  on_boot:
    - priority: -50 # after home_page.yaml restores the Home page at 0
      then:
        - lambda: id(home_page_restored) = true;
    - priority: -100
      then:
        - script.execute: go_home

font: !include
  file: ../fonts/fonts.yaml
  vars:
    text_sm: ${text_sm}
    text_md: ${text_md}
    text_lg: ${text_lg}
    text_xl: ${text_xl}
    text_xxl: ${text_xxl}
    icons_sm: ${icons_sm}
    icons_md: ${icons_md}
    icons_lg: ${icons_lg}
    icons_xl: ${icons_xl}
    icons_xxl: ${icons_xxl}

.sizing:
  - &nav_widget_vars
    height: ${header_height}
    padding: ${nav_padding}

script:
  # each page's home_page.yaml adds the line that shows it when it's home
  - id: go_home
    then: []

select:
  # Which page is home, from Home Assistant; ${home_page} is the default.
  # Each page's home_page.yaml adds itself to the list.
  - id: home_page_select
    platform: template
    name: Home page
    icon: mdi:home
    entity_category: config
    optimistic: true
    initial_option: ${home_page}
    options: []
    on_value:
      - lambda: |-
          if (id(home_page_restored))
            id(home_page_hash) = fnv1_hash(x);

globals:
  # The select would restore its position in the list, which points at a
  # different page once pages are added or removed. So remember the page's
  # name instead, as a hash, and home_page.yaml puts it back at boot.
  - id: home_page_hash
    type: uint32_t
    restore_value: true
    initial_value: '0'
  - id: home_page_restored # on_value stays quiet until the restore is done
    type: bool
    initial_value: 'false'

lvgl:
  id: main_lvgl
  default_font: roboto_md
  theme: !include ../themes/main.yaml
  top_layer:
    widgets:
      - <<: !include { file: ../common/header.yaml, vars: { <<: *nav_widget_vars } }
      - !include { file: tabs.yaml, vars: { height: "${footer_height}", padding: "${nav_padding}" } }
      - obj: !include brightness_popup.yaml # the brightness pop-up, over every page
      - <<: !include { file: ../common/boot_screen.yaml }
  pages:
    - id: splash # blank until on_boot goes home
      skip: true
  # every other page is a package in ui/pages/, listed in ui/pages.yaml

packages:
  header: !include { file: ../common/header.logic.yaml }
  boot_screen: !include { file: ../common/boot_screen.logic.yaml }
  brightness_popup: !include brightness_popup.logic.yaml
