# Weather: current conditions from the weather entity, and a 6-day forecast
# fetched with weather.get_forecasts (an action response; the device must be allowed to
# perform Home Assistant actions). Part of layouts/ui/pages.yaml.
# Vars: weather_entity (substitution, set in main.yaml).

lvgl:
  pages:
    - id: weather
      <<: !include ../vars/page.yaml
      bg_color: 0x1C1C1C # Home Assistant card grey; the header and tab bars (0x2B2B2B) stand apart
      on_load:
        - lvgl.label.update:
            id: page_title
            text: Weather
        - script.execute: { id: tab_select, page: weather }
        - script.execute: weather_fetch
      widgets:
        - obj: # current conditions
            x: ${gap}
            y: ${gap}
            width: ${screen_w - 2 * gap}
            height: ${wx_now_h}
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            pad_left: ${wx_pad}
            pad_right: ${wx_pad}
            scrollable: false
            layout: # icon at the left edge, text block at the right edge
              type: FLEX
              flex_flow: ROW
              flex_align_main: SPACE_BETWEEN
              flex_align_cross: CENTER
            widgets:
              - label:
                  id: wx_now_icon
                  text: "\U000F05D6"
                  text_font: weather_xl
              - obj:
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    flex_align_cross: END
                    pad_row: 2
                  widgets:
                    - label: { id: wx_now_temp, text: "--°", text_font: temp_xl }
                    - label: { id: wx_now_cond, text: "--", text_font: roboto_md }
                    - label: { id: wx_now_hilo, text: " ", text_font: roboto_sm, text_opa: 70% }
                    - label: { id: wx_now_humidity, text: " ", text_font: roboto_sm, text_opa: 70% }
        - obj: # forecast
            x: ${gap}
            y: ${wx_now_h + 2 * gap}
            width: ${screen_w - 2 * gap}
            height: SIZE_CONTENT
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            layout:
              type: FLEX
              flex_flow: COLUMN
              pad_row: ${wx_row_gap}
            widgets:
              - obj:
                  id: wx_row_0
                  width: 100%
                  height: ${wx_row_h}
                  bg_color: 0xFFFFFF
                  bg_opa: 8%
                  radius: 10
                  border_width: 0
                  pad_left: ${wx_pad}
                  pad_right: ${wx_pad}
                  scrollable: false
                  widgets:
                    - label: { id: wx_d0_day, align: LEFT_MID, text: " ", text_font: roboto_md }
                    - label: { id: wx_d0_icon, align: LEFT_MID, x: "${wx_icon_x}", text: "", text_font: mdi_md }
                    - label: { id: wx_d0_drop, align: LEFT_MID, x: "${wx_drop_x}", text: "\U000F058E", text_font: icon_xs, text_opa: 60%, hidden: true }
                    - label: { id: wx_d0_rain, align: LEFT_MID, x: "${wx_rain_x}", text: " ", text_font: text_detail, text_opa: 70% }
                    - label: { id: wx_d0_lo, align: LEFT_MID, x: "${wx_lo_x}", width: "${wx_num_w}", text: " ", text_align: RIGHT, text_font: roboto_sm, text_opa: 80% }
                    - obj: # temperature range track; ui::render_forecast places the fill
                        id: wx_d0_track
                        align: LEFT_MID
                        x: ${wx_track_x}
                        width: ${wx_track_w}
                        height: 10
                        radius: 5
                        bg_color: 0xFFFFFF
                        bg_opa: 15%
                        border_width: 0
                        pad_all: 0
                        scrollable: false
                        widgets:
                          - obj: { id: wx_d0_fill, x: 0, y: 0, width: 0, height: 100%, radius: 5, border_width: 0, pad_all: 0, bg_grad_dir: HOR }
                    - label: { id: wx_d0_hi, align: RIGHT_MID, width: "${wx_num_w}", text: " ", text_align: RIGHT, text_font: roboto_sm, text_opa: 80% }
                    - obj: # where the temperature is right now; ui::place_now_marker puts it on the bar
                        id: wx_now_marker
                        width: 6
                        height: 6
                        radius: 3
                        bg_color: 0xFFFFFF
                        bg_opa: COVER
                        border_width: 0
                        shadow_width: 0
                        pad_all: 0
                        hidden: true
              - obj:
                  id: wx_row_1
                  width: 100%
                  height: ${wx_row_h}
                  bg_color: 0xFFFFFF
                  bg_opa: 8%
