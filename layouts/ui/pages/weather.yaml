packages:
  weather_access: !include { file: ../home_page.yaml, vars: { page: weather, label: "Weather" } }

text_sensor:
  - platform: homeassistant
    id: wx_condition
    entity_id: ${weather_entity}
    on_value:
      - lambda: |-
          lv_label_set_text(id(wx_now_icon), ui::weather_icon(x));
          lv_obj_set_style_text_color(id(wx_now_icon), ui::weather_color(x), LV_PART_MAIN);
          lv_label_set_text(id(wx_now_cond), ui::weather_label(x).c_str());

sensor:
  - platform: homeassistant
    id: wx_temperature
    entity_id: ${weather_entity}
    attribute: temperature
    on_value:
      - lambda: |-
          lv_label_set_text(id(wx_now_temp), isnan(x) ? "--°" : (std::to_string((int) lroundf(x)) + "°").c_str());
          ui::place_now_marker(id(wx_now_marker), id(wx_d0_track), id(wx_d0_fill), x);
  - platform: homeassistant
    id: wx_humidity
    entity_id: ${weather_entity}
    attribute: humidity
    on_value:
      - lambda: |-
          lv_label_set_text(id(wx_now_humidity), isnan(x) ? " " : ("Humidity " + std::to_string((int) lroundf(x)) + "%").c_str());

interval:
  - interval: 30min
    then:
      - script.execute: weather_fetch

script:
  # weather.get_forecasts (daily) -> one line per day: label|condition|high|low|precip %
  - id: weather_fetch
    mode: single
    then:
      - if:
          condition: api.connected
          then:
            - homeassistant.action:
                action: weather.get_forecasts
                data:
                  entity_id: ${weather_entity}
                  type: daily
                capture_response: true
                response_template: |-  # literal block: the line breaks are part of the output
                  {%- set f = (response.values() | first).forecast if response else [] -%}
                  {%- for d in f[:6] -%}
                  {%- set t = as_datetime(d.datetime) | as_local -%}
                  {{ 'Today' if t.date() == now().date() else t.strftime('%a') }}|{{ d.condition }}|{{ (d.temperature | round(0) | int) if d.temperature is not none else '' }}|{{ (d.templow | round(0) | int) if d.templow is defined and d.templow is not none else '' }}|{{ d.precipitation_probability | int(0) if d.precipitation_probability is defined else '' }}
                  {% endfor -%}
                on_success:
                  - lambda: |-
                      {  // log the raw reply (debugging aid)
                        std::string raw;
                        serializeJson(response, raw);
                        ESP_LOGI("ui", "weather reply (%u bytes): %.900s", (unsigned) raw.size(), raw.c_str());
                      }
                      const std::string txt = response["response"].is<const char *>() ? response["response"].as<std::string>() : std::string();
                      ui::ForecastRow rows[] = {
                          {id(wx_row_0), id(wx_d0_day), id(wx_d0_icon), id(wx_d0_drop), id(wx_d0_rain), id(wx_d0_lo), id(wx_d0_track), id(wx_d0_fill), id(wx_d0_hi)},
                          {id(wx_row_1), id(wx_d1_day), id(wx_d1_icon), id(wx_d1_drop), id(wx_d1_rain), id(wx_d1_lo), id(wx_d1_track), id(wx_d1_fill), id(wx_d1_hi)},
                          {id(wx_row_2), id(wx_d2_day), id(wx_d2_icon), id(wx_d2_drop), id(wx_d2_rain), id(wx_d2_lo), id(wx_d2_track), id(wx_d2_fill), id(wx_d2_hi)},
                          {id(wx_row_3), id(wx_d3_day), id(wx_d3_icon), id(wx_d3_drop), id(wx_d3_rain), id(wx_d3_lo), id(wx_d3_track), id(wx_d3_fill), id(wx_d3_hi)},
                          {id(wx_row_4), id(wx_d4_day), id(wx_d4_icon), id(wx_d4_drop), id(wx_d4_rain), id(wx_d4_lo), id(wx_d4_track), id(wx_d4_fill), id(wx_d4_hi)},
                          {id(wx_row_5), id(wx_d5_day), id(wx_d5_icon), id(wx_d5_drop), id(wx_d5_rain), id(wx_d5_lo), id(wx_d5_track), id(wx_d5_fill), id(wx_d5_hi)},
                      };
                      ui::render_forecast(txt, rows, 6, id(wx_now_hilo), id(wx_temperature).state, id(wx_now_marker));
                on_error:
                  - logger.log:
                      level: WARN
                      format: "weather.get_forecasts failed: %s"
                      args: [error.c_str()]
