# required vars:
# - uid
# - entity_id
# - width
# - height
# - text
# - icon_on
# - icon_off

# button:
  <<: !include
    file: ../stateful.yaml
    vars:
      uid: ${uid}
      width: ${width}
      height: ${height}
      icon_on: ${icon_on}
      icon_off: ${icon_off}
      text: ${text}
  on_short_click:
    # build-time proof that this tile's sensors package was included: a missing
    # one used to leave the tile showing the unknown glyph forever, silently
    - lambda: (void) id(${uid}_widget_sensor);
    - homeassistant.action:
        action: media_player.toggle
        data:
          entity_id: ${entity_id}
