# A thermostat, the page wide: the target on a - / + stepper, the room temperature by the
# icon, and the icon showing what it's doing (heating, cooling, fan).
#
# vars:
#   page:      the page it goes on (widgets/page.yaml)
#   entity_id: the climate entity, e.g. climate.living_room
#   text:      its name (default Thermostat)
#   step:      how far a tap moves the target (default 0.5; 1 suits Fahrenheit)
#   uid:       a unique id for its widgets (default: the entity id after the dot)

defaults:
  uid: ${entity_id.split(".")[1]}
  text: Thermostat
  step: "0.5"

lvgl:
  pages:
    - id: !extend ${page}
      widgets:
        - obj:
            id: !extend ${page}_widgets
            widgets:
              - obj:
                  <<: !include
                    file: parts/thermostat.yaml
                    vars:
                      uid: ${uid}
                      text: ${text}
                      <<: !include ../ui/vars/stepper.yaml

packages:
  sensors: !include { file: parts/thermostat.sensors.yaml, vars: { uid: "${uid}", entity_id: "${entity_id}", step: "${step}" } }
