# A light: tap toggles it. Also fits a light group with no page of its own.
#
# vars:
#   page:      the page it goes on (widgets/page.yaml)
#   entity_id: the entity, e.g. light.porch
#   text:      its name on screen
#   uid:       a unique id for its widgets (default: the entity id after the dot)
#   width, height: default half the page wide, the tile height

defaults:
  uid: ${entity_id.split(".")[1]}
  width: 49%
  height: ${tile_height}

lvgl:
  pages:
    - id: !extend ${page}
      widgets:
        - obj:
            id: !extend ${page}_widgets
            widgets:
              - button:
                  <<: !include
                    file: parts/light.yaml
                    vars: { uid: "${uid}", entity_id: "${entity_id}", text: "${text}", width: "${width}", height: "${height}" }

packages:
  sensors: !include { file: parts/light.sensors.yaml, vars: { uid: "${uid}", entity_id: "${entity_id}" } }
