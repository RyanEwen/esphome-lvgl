# Tray sensor for a single-tray AMS unit.
#
# required vars:
# - uid
# - entity_id_prefix
# - ams_id

text_sensor:

  - id: ${uid}_ams_${ams_id}_tray_1_remain
    platform: homeassistant
    entity_id: sensor.${entity_id_prefix}_ams_${ams_id}_tray_1
    attribute: remain
    on_value:
      - lvgl.label.update:
          id: ${uid}_ams_${ams_id}_tray_1_remaining_lbl
          text: !lambda |-
            if (x == "-1") {
              return std::string("--");
            }
            return x + "%";

  - id: ${uid}_ams_${ams_id}_tray_1_color
    platform: homeassistant
    entity_id: sensor.${entity_id_prefix}_ams_${ams_id}_tray_1
    attribute: color
    on_value:
      - lvgl.widget.update:
          id: ${uid}_ams_${ams_id}_tray_1_obj
          bg_color: !lambda return lv_color_hex(tray::bg(x));
          # ink follows the filament, so the number stays readable on white PLA
          text_color: !lambda return lv_color_hex(tray::ink(x));