text_sensor:
  - id: ${uid}_print_status
    platform: homeassistant
    entity_id: sensor.${entity_id_prefix}_print_status
    filters:
      - lambda: |-
          x[0] = toupper(x[0]);
          return x;
    on_value:
      - lvgl.label.update:
          id: ${uid}_print_status_lbl
          text: !lambda return x;
      - if:
          condition:
            - text_sensor.state:
                id: ${uid}_print_status
                state: 'Failed'
          then:
            - lvgl.bar.update:
                id: ${uid}_print_progress_bar
                indicator:
                  bg_color: 0xFF0000
          else:
            - if:
                condition:
                  - text_sensor.state:
                      id: ${uid}_print_status
                      state: 'Pause'
                then:
                  - lvgl.bar.update:
                      id: ${uid}_print_progress_bar
                      indicator:
                        bg_color: 0xFFAF00
                else:
                  - if:
                      condition:
                        - text_sensor.state:
                            id: ${uid}_print_status
                            state: 'Finish'
                      then:
                        - lvgl.bar.update:
                            id: ${uid}_print_progress_bar
                            indicator:
                              bg_color: 0x4CAF50
                      else:
                        - lvgl.bar.update:
                            id: ${uid}_print_progress_bar
                            indicator:
                              bg_color: 0x00B6FF

  - id: ${uid}_remaining_time
    platform: homeassistant
    entity_id: sensor.${entity_id_prefix}_remaining_time
    on_value:
      - if:
          condition:
            or:
              - text_sensor.state:
                  id: ${uid}_print_status
                  state: 'Prepare'
              - text_sensor.state:
                  id: ${uid}_print_status
                  state: 'Running'
          then:
            - lvgl.label.update:
                id: ${uid}_remaining_time_lbl
                text: !lambda |-
                  int total_mins = (int) lroundf(atof(x.c_str()) * 60.0f);
                  int hours = total_mins / 60;
                  int mins = total_mins % 60;
                  return std::to_string(hours) + " hr " + std::to_string(mins) + " min";
          else:
            - lvgl.label.update:
                id: ${uid}_remaining_time_lbl
                text: " "
      - if:
          condition:
            - lambda: return atof(id(${uid}_remaining_time).state.c_str()) == 0.0f;
          then:
            - lvgl.label.update:
                id: ${uid}_remaining_time_lbl
                text: " "

  - id: ${uid}_end_time
    platform: homeassistant
    entity_id: sensor.${entity_id_prefix}_end_time
    on_value:
      - if:
          condition:
            text_sensor.state:
              id: ${uid}_print_status
              state: 'Running'
          then:
            - lvgl.label.update:
                id: ${uid}_end_time_lbl
                text: !lambda |-
                  auto now = id(ha_time).now();
                  if (!now.is_valid()) {
                    return std::string(" ");
                  }
                  float hours = atof(id(${uid}_remaining_time).state.c_str());
                  auto end = ESPTime::from_epoch_local(now.timestamp + (time_t) (hours * 3600.0f));
                  char buf[16];
                  end.strftime(buf, sizeof(buf), "%I:%M %p");
                  std::string formatted = buf;
                  if (!formatted.empty() && formatted[0] == '0') {
                    formatted.erase(0, 1);
                  }
                  return formatted;
          else:
            - lvgl.label.update:
                id: ${uid}_end_time_lbl
                text: " "

  - id: ${uid}_ams_tray_1_remain
    platform: homeassistant
    entity_id: sensor.${entity_id_prefix}_ams_1_tray_1
    attribute: remain
    on_value:
      - lvgl.label.update:
          id: ${uid}_ams_tray_1_remaining_lbl
          text: !lambda return x + '%';

  - id: ${uid}_ams_tray_1_color
    platform: homeassistant
    entity_id: sensor.${entity_id_prefix}_ams_1_tray_1
    attribute: color
    on_value:
      - lvgl.widget.update:
          id: ${uid}_ams_tray_1_obj
          bg_color: !lambda |-
            // Home Assistant sends the literal "unavailable" or "None" when an
            // entity has no value, and this firmware is built -fno-exceptions,
            // so std::stoi on either does not throw -- it aborts, which panics
            // and reboots the display. strtol cannot, and the length and prefix
            // checks reject anything that is not #RRGGBB or #RRGGBBAA first.
            if ((x.size() != 7 && x.size() != 9) || x[0] != '#') {
              return lv_color_hex(0x42495A); // the tile's own background
            }
            char *end = nullptr;
            long rgb = strtol(x.substr(1, 6).c_str(), &end, 16);
            if (end == nullptr || *end != '\0') {
              return lv_color_hex(0x42495A);
            }
            return lv_color_make((rgb >> 16) & 0xFF, (rgb >> 8) & 0xFF, rgb & 0xFF);

