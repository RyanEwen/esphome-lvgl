sensor:
  - id: ${uid}_print_progress
    platform: homeassistant
    entity_id: sensor.${entity_id_prefix}_print_progress
    on_value:
      - lvgl.bar.update:
          id: ${uid}_print_progress_bar
          value: !lambda return x;
