# Humidity readout for one AMS unit.
#
# required vars:
# - uid
# - entity_id_prefix
# - ams_id

sensor:
  - id: ${uid}_ams_${ams_id}_humidity
    platform: homeassistant
    entity_id: sensor.${entity_id_prefix}_ams_${ams_id}_humidity
    on_value:
      # every AMS reports humidity, so this doubles as "the unit is there".
      # A layout that starts its rows hidden gets them revealed as the units
      # report; where rows are always visible this is a no-op.
      - lvgl.widget.show: ${uid}_ams_${ams_id}_row
      - lvgl.label.update:
          id: ${uid}_ams_${ams_id}_humidity_lbl
          text: !lambda |- # clamped to 99 so the column fits two digits
            int pct = (int) lroundf(x);
            if (pct > 99) pct = 99;
            if (pct < 0) pct = 0;
            return std::to_string(pct);
