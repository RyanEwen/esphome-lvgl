# Volume down; holding it keeps stepping. No state, so no sensors file.
#
# required vars:
# - uid
# - width
# - height
# - entity_id
# - action:    the Home Assistant action to call on entity_id, e.g. media_player.volume_down
#              or script.turn_on (entity_id then being the script)

# button:
  <<: !include
    file: base/icon_stateless.yaml
    vars:
      uid: ${uid}
      width: ${width}
      height: ${height}
      icon: "\U000F075E"
  on_short_click:
    - homeassistant.action:
        action: ${action}
        data:
          entity_id: ${entity_id}
  on_long_press_repeat:
    - homeassistant.action:
        action: ${action}
        data:
          entity_id: ${entity_id}
