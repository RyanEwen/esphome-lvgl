# A value you set by steps: the name and an icon on the left, [-] value [+]
# on the right. The base for number.yaml and thermostat.yaml, which bind
# the value to an entity; not used on its own.
#
# The tile is an obj, like the status tiles, so it renders darker and only the
# two buttons read as pressable. Each tap moves a pending value on screen at
# once; the family's sensors file sends it to Home Assistant a moment after the
# last tap, so a run of taps is one call, not one each.
#
# required vars:
# - uid
# - width
# - height
# - text
# - icon
# - button_width
# - value_width
# - detail       # the line under the name until a value comes in ("" hides it)

# obj:
  id: ${uid}_widget
  width: ${width}
  height: ${height}
  bg_color: 0x3C3C3C # a tile's grey, like the TV card
  border_width: 0
  radius: 10
  pad_all: 8
  pad_left: 14
  scrollable: false
  layout:
    type: FLEX
    flex_flow: ROW
    flex_align_cross: CENTER
    pad_column: 4
  widgets:
    # the name side: the icon, then the name with a detail line under it (climate puts the
    # room temperature there). It takes whatever the buttons leave; a long name ends in "..."
    - label:
        id: ${uid}_widget_icon
        text: ${icon}
        text_font: mdi_md
        text_color: 0x9AA0AE
    - obj:
        flex_grow: 1
        height: SIZE_CONTENT
        bg_opa: TRANSP
        border_width: 0
        pad_all: 0
        pad_left: 6
        clickable: false
        scrollable: false
        layout:
          type: FLEX
          flex_flow: COLUMN
          pad_row: 2
        widgets:
          - label:
              id: ${uid}_widget_text
              text: ${text}
              text_font: ${tile_font}
              width: 100%
              long_mode: DOT
              height: "${(tile_font_size * 6) // 5}" # one line, so a long name ends in "..."
          # hidden when empty, so a lone name sits centred beside the icon
          - label:
              id: ${uid}_widget_detail
              text: "${detail}"
              hidden: ${detail == ""}
              text_font: roboto_sm
              text_opa: 65%
    - obj:
        width: SIZE_CONTENT
        height: 100%
        bg_opa: TRANSP
        border_width: 0
        pad_all: 0
        layout:
          type: FLEX
          pad_column: 4
          flex_flow: ROW
          flex_align_cross: CENTER
          flex_align_track: CENTER
        widgets:
          - button:
              id: ${uid}_widget_minus
              width: ${button_width}
              height: 100%
              bg_color: 0x4A4A4A # like the TV card's buttons
              radius: 10
              shadow_width: 0
              on_click:
                - script.execute:
                    id: ${uid}_nudge
                    steps: -1
              widgets:
                - label:
                    text: "\U000F0374" # minus
                    text_font: mdi_md
                    align: CENTER
          - label:
              id: ${uid}_widget_value
              width: ${value_width}
              text: "--"
              text_font: roboto_lg
              text_align: CENTER
          - button:
              id: ${uid}_widget_plus
              width: ${button_width}
              height: 100%
              bg_color: 0x4A4A4A # like the TV card's buttons
              radius: 10
              shadow_width: 0
              on_click:
                - script.execute:
                    id: ${uid}_nudge
                    steps: 1
              widgets:
                - label:
                    text: "\U000F0415" # plus
                    text_font: mdi_md
                    align: CENTER
