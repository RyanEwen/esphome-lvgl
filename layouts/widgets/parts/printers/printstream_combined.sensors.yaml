# A printer from the printstream integration, one AMS on the name line (tile_combined.yaml):
# the same card as bambulab_combined.sensors.yaml (ha-bambulab), reading printstream's names.
#
# required vars:
# - uid
# - entity_id_prefix   # printstream's entity ids start sensor.<prefix>_ (e.g. my_printer)

packages:
  core: !include { file: core.sensors.yaml, vars: { status_entity: status, progress_entity: progress, remaining_minutes_per_unit: "1.0f", remain_attribute: remain_percent, drying_variant: _printstream } }
  ams_1: !include { file: ams_row.sensors.yaml, vars: { ams_id: "1", status_entity: status, progress_entity: progress, remaining_minutes_per_unit: "1.0f", remain_attribute: remain_percent, drying_variant: _printstream } }
