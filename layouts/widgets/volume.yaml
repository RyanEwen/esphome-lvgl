# Volume down and up for a media player, side by side; holding one keeps stepping.
# For a device with no media_player (an IR soundbar, say), give a pair of scripts instead.
#
# vars:
#   page:      the page it goes on (widgets/page.yaml)
#   entity_id: the media_player (leave out when using down_script/up_script)
#   down_script, up_script: scripts to run instead of media_player.volume_down/up
#   uid:       a unique id for its widgets (default: the entity id after the dot;
#              required with scripts)
#   height:    default a little under the tile height

defaults:
  entity_id: ""
  uid: ${entity_id.split(".")[1]}
  height: ${tile_height - 20}
  down_script: ""
  up_script: ""

lvgl:
  pages:
    - id: !extend ${page}
      widgets:
        - obj:
            id: !extend ${page}_widgets
            widgets:
              - button:
                  <<: !include
                    file: parts/volume_down.yaml
                    vars:
                      uid: "${uid}_vol_down"
                      action: "${'script.turn_on' if down_script else 'media_player.volume_down'}"
                      entity_id: "${down_script or entity_id}"
                      width: 49%
                      height: "${height}"
              - button:
                  <<: !include
                    file: parts/volume_up.yaml
                    vars:
                      uid: "${uid}_vol_up"
                      action: "${'script.turn_on' if up_script else 'media_player.volume_up'}"
                      entity_id: "${up_script or entity_id}"
                      width: 49%
                      height: "${height}"
