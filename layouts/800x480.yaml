font: !include
  file: fonts/fonts.yaml
  vars:
    text_sm: 26
    text_md: 30
    text_lg: 34
    text_xl: 48
    text_xxl: 64
    icons_sm: 26
    icons_md: 32
    icons_lg: 40
    icons_xl: 48
    icons_xxl: 56

.sizing:
  - &nav_widget_vars
    height: 65
    padding: 8

  - &page_styles
    <<: !include styles/page_styles.yaml
    pad_top: 65
    pad_bottom: 65

  - &container_styles
    <<: !include styles/container_styles.yaml
    pad_top: 0
    pad_bottom: 0
    pad_left: 10
    pad_right: 10

  - &button_layout
    <<: !include styles/button_layout.yaml
    pad_column: 10
    pad_row: 10

  - &button_widget_vars
    width: 49%
    height: 100

  - &wide_button_widget_vars
    width: 100%
    height: 100

  - &printer_layout
    <<: !include styles/printer_layout.yaml
    pad_row: 10

  - &printer_tile
    <<: !include styles/printer_tile.yaml
    pad_all: 8

  - &printer_tile_layout
    <<: !include styles/printer_tile_layout.yaml
    pad_row: 6

  - &printer_bar_vars
    bar_height: 8

  - &ams_row_vars
    ams_label_width: 36
    ams_hum_width: 85 # heater 26 + 2 + '99' 29 + 2 + glyph 26
    ams_strip_width: 295
    ams_tray_width: 70
    ams_tray_height: 35
    ams_tray_padding: 5

script:
  - id: go_home
    then:
      - lvgl.page.show: ${home_page}

lvgl:
  default_font: roboto_md
  theme: !include themes/main.yaml
  top_layer:
    widgets:
      - <<: !include { file: widgets/header/widget.yaml, vars: { <<: *nav_widget_vars } }
      - <<: !include { file: widgets/footer/widget.yaml, vars: { <<: *nav_widget_vars } }
      - <<: !include { file: widgets/boot_screen/widget.yaml }
  pages:
    - id: splash
      skip: true
      on_load:
        - delay: 250ms # page.show is dropped if called during this on_load
        - script.execute: go_home

    - id: lighting_1
      <<: *page_styles
      on_load:
        - lvgl.label.update:
            id: page_title
            text: Inside Lighting
      widgets:
        - obj:
            <<: *container_styles
            layout:
              <<: *button_layout
            widgets:
              - button: # second floor lights
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_group_buttons/widget.yaml
                    vars:
                      uid: second_floor_lights
                      entity_id: light.second_floor_lights
                      text: Second Floor
                      <<: *wide_button_widget_vars

              - button: # bedroom lights
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml
                    vars:
                      uid: all_bedroom_lights
                      entity_id: light.all_bedroom_lights
                      text: Bedroom
                      <<: *button_widget_vars

              - button: # railyn light
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml
                    vars:
                      uid: railyns_light
                      entity_id: light.railyns_light
                      text: Railyn
                      <<: *button_widget_vars

              - button: # ryan's office light
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml
                    vars:
                      uid: all_ryan_s_office_lights
                      entity_id: light.all_ryan_s_office_lights
                      text: Office
                      <<: *button_widget_vars

              - button: # upstairs hallway light
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml
                    vars:
                      uid: upstairs_hallway_light
                      entity_id: light.upstairs_hallway_light
                      text: Hallway
                      <<: *button_widget_vars

              - button: # main floor lights
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_group_buttons/widget.yaml
                    vars:
                      uid: main_floor_lights
                      entity_id: light.main_floor_lights
                      text: Main Floor
                      <<: *wide_button_widget_vars

              - button: # living room light
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml
                    vars:
                      uid: all_living_room_lights
                      entity_id: light.all_living_room_lights
                      text: Living Room
                      <<: *button_widget_vars

              - button: # kitchen light
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml
                    vars:
                      uid: kitchen_light
                      entity_id: light.kitchen_light
                      text: Kitchen
                      <<: *button_widget_vars

              - button: # rachel's office light
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml
                    vars:
                      uid: rachels_office_light
                      entity_id: light.rachels_office_light
                      text: Office
                      <<: *button_widget_vars

    - id: lighting_2
      <<: *page_styles
      on_load:
        - lvgl.label.update:
            id: page_title
            text: Outside Lighting
      widgets:
        - obj:
            <<: *container_styles
            layout:
              <<: *button_layout
            widgets:
              - button: # outdoor lights
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_group_buttons/widget.yaml
                    vars:
                      uid: all_outside_lights
                      entity_id: light.all_outside_lights
                      text: Outside Lights
                      <<: *wide_button_widget_vars

              - button: # door lights
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml
                    vars:
                      uid: outside_light_1
                      entity_id: light.outside_light_1
                      text: Door Lights
                      <<: *button_widget_vars

              - button: # deck lights
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml
                    vars:
                      uid: outside_light_2
                      entity_id: light.outside_light_2
                      text: Deck Lights
                      <<: *button_widget_vars

    - id: printers
      <<: *page_styles
      on_load:
        - lvgl.label.update:
            id: page_title
            text: Printers
      widgets:
        - obj:
            <<: *container_styles
            layout:
              <<: *printer_layout
            widgets:
              - obj: # printer 1
                  <<: *printer_tile
                  layout:
                    <<: *printer_tile_layout
                  widgets:
                    - label: # printer name
                        width: 100%
                        height: SIZE_CONTENT
                        text: 1 - Fred
                    - obj: # AMS 1
                        <<: !include { file: widgets/printers/ams_row.yaml, vars: {
                          uid: printer_1, ams_id: "1", label: "1", <<: *ams_row_vars } }
                    - obj: # status / times
                        <<: !include { file: widgets/printers/tile_status.yaml, vars: {
                          uid: printer_1 } }
                    - bar: # print progress
                        <<: !include { file: widgets/printers/tile_progress.yaml, vars: {
                          uid: printer_1, <<: *printer_bar_vars } }

              - obj: # printer 2
                  <<: *printer_tile
                  layout:
                    <<: *printer_tile_layout
                  widgets:
                    - label: # printer name
                        width: 100%
                        height: SIZE_CONTENT
                        text: 2 - Wilma
                    - obj: # AMS 1
                        <<: !include { file: widgets/printers/ams_row.yaml, vars: {
                          uid: printer_2, ams_id: "1", label: "1", <<: *ams_row_vars } }
                    - obj: # status / times
                        <<: !include { file: widgets/printers/tile_status.yaml, vars: {
                          uid: printer_2 } }
                    - bar: # print progress
                        <<: !include { file: widgets/printers/tile_progress.yaml, vars: {
                          uid: printer_2, <<: *printer_bar_vars } }

              - obj: # printer 3
                  <<: *printer_tile
                  layout:
                    <<: *printer_tile_layout
                  widgets:
                    - label: # printer name
                        width: 100%
                        height: SIZE_CONTENT
                        text: 3 - Barney
                    - obj: # AMS 1
                        <<: !include { file: widgets/printers/ams_row.yaml, vars: {
                          uid: printer_3, ams_id: "1", label: "1", <<: *ams_row_vars } }
                    - obj: # status / times
                        <<: !include { file: widgets/printers/tile_status.yaml, vars: {
                          uid: printer_3 } }
                    - bar: # print progress
                        <<: !include { file: widgets/printers/tile_progress.yaml, vars: {
                          uid: printer_3, <<: *printer_bar_vars } }

              - obj: # printer 4
                  <<: *printer_tile
                  layout:
                    <<: *printer_tile_layout
                  widgets:
                    - label: # printer name
                        width: 100%
                        height: SIZE_CONTENT
                        text: 4 - Betty
                    - obj: # AMS 1
                        <<: !include { file: widgets/printers/ams_row.yaml, vars: {
                          uid: printer_4, ams_id: "1", label: "1", <<: *ams_row_vars } }
                    - obj: # status / times
                        <<: !include { file: widgets/printers/tile_status.yaml, vars: {
                          uid: printer_4 } }
                    - bar: # print progress
                        <<: !include { file: widgets/printers/tile_progress.yaml, vars: {
                          uid: printer_4, <<: *printer_bar_vars } }

              - obj: # printer 5
                  <<: *printer_tile
                  layout:
                    <<: *printer_tile_layout
                  widgets:
                    - label: # printer name
                        width: 100%
                        height: SIZE_CONTENT
                        text: 5 - Dinno
                    - obj: # AMS 1
                        <<: !include { file: widgets/printers/ams_row.yaml, vars: {
                          uid: printer_5, ams_id: "1", label: "1", <<: *ams_row_vars } }
                    - obj: # status / times
                        <<: !include { file: widgets/printers/tile_status.yaml, vars: {
                          uid: printer_5 } }
                    - bar: # print progress
                        <<: !include { file: widgets/printers/tile_progress.yaml, vars: {
                          uid: printer_5, <<: *printer_bar_vars } }

              - obj: # printer 6
                  <<: *printer_tile
                  layout:
                    <<: *printer_tile_layout
                  widgets:
                    - label: # printer name
                        width: 100%
                        height: SIZE_CONTENT
                        text: 6 - Pebbles
                    - obj: # AMS 1
                        <<: !include { file: widgets/printers/ams_row.yaml, vars: {
                          uid: printer_6, ams_id: "1", label: "1", <<: *ams_row_vars } }
                    # A printer with more than one AMS gets one more row here,
                    # plus its sensor packages below. An AMS HT is a single-tray
                    # unit, so it uses ams_row_single.yaml:
                    #
                    # - obj: # AMS 2
                    #     <<: !include { file: widgets/printers/ams_row.yaml, vars: {
                    #       uid: printer_6, ams_id: "2", label: "2", <<: *ams_row_vars } }
                    # - obj: # AMS HT
                    #     <<: !include { file: widgets/printers/ams_row_single.yaml, vars: {
                    #       uid: printer_6, ams_id: "128", label: "HT", <<: *ams_row_vars } }
                    - obj: # status / times
                        <<: !include { file: widgets/printers/tile_status.yaml, vars: {
                          uid: printer_6 } }
                    - bar: # print progress
                        <<: !include { file: widgets/printers/tile_progress.yaml, vars: {
                          uid: printer_6, <<: *printer_bar_vars } }

packages:
  # header
  header_sensors: !include { file: widgets/header/sensors.yaml }

  # boot screen
  boot_screen_sensors: !include { file: widgets/boot_screen/sensors.yaml }

  # lighting
  second_floor_lights_widget_sensors: !include { file: widgets/buttons/icon_text_buttons/light_group_buttons/sensors.yaml, vars: {
    uid: second_floor_lights,
    entity_id: light.second_floor_lights
  }}

  all_bedroom_lights_widget_sensors: !include { file: widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: {
    uid: all_bedroom_lights,
    entity_id: light.all_bedroom_lights
  }}

  railyns_light_widget_sensors: !include { file: widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: {
    uid: railyns_light,
    entity_id: light.railyns_light
  }}

  ryans_office_light_widget_sensors: !include { file: widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: {
    uid: all_ryan_s_office_lights,
    entity_id: light.all_ryan_s_office_lights
  }}

  upstairs_hallway_light_widget_sensors: !include { file: widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: {
    uid: upstairs_hallway_light,
    entity_id: light.upstairs_hallway_light
  }}

  main_floor_lights_widget_sensors: !include { file: widgets/buttons/icon_text_buttons/light_group_buttons/sensors.yaml, vars: {
    uid: main_floor_lights,
    entity_id: light.main_floor_lights
  }}

  all_living_room_lights_widget_sensors: !include { file: widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: {
    uid: all_living_room_lights,
    entity_id: light.all_living_room_lights
  }}

  kitchen_light_widget_sensors: !include { file: widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: {
    uid: kitchen_light,
    entity_id: light.kitchen_light
  }}

  rachels_office_light_widget_sensors: !include { file: widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: {
    uid: rachels_office_light,
    entity_id: light.rachels_office_light
  }}

  # lighting 2
  all_outside_lights_widget_sensors: !include { file: widgets/buttons/icon_text_buttons/light_group_buttons/sensors.yaml, vars: {
    uid: all_outside_lights,
    entity_id: light.all_outside_lights
  }}

  outside_light_1_widget_sensors: !include { file: widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: {
    uid: outside_light_1,
    entity_id: light.outside_light_1
  }}

  outside_light_2_widget_sensors: !include { file: widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: {
    uid: outside_light_2,
    entity_id: light.outside_light_2
  }}

  # printers
  # One sensors_core package per printer, then per AMS unit: an ams_row.sensors
  # package (or ams_row_single.sensors for an AMS HT), an ams_row_humidity
  # package, and -- only for a unit with drying hardware -- an ams_row_drying
  # package. Drying belongs to the unit rather than to the printer, so if a unit
  # moves to another machine its packages move with it, under the new prefix.

  printer_1_sensors: !include { file: widgets/printers/sensors_core.yaml, vars: {
    uid: printer_1,
    entity_id_prefix: p1s_1
  }}

  printer_1_ams_1_sensors: !include { file: widgets/printers/ams_row.sensors.yaml, vars: {
    uid: printer_1,
    entity_id_prefix: p1s_1,
    ams_id: "1"
  }}

  printer_1_ams_1_humidity: !include { file: widgets/printers/ams_row_humidity.sensors.yaml, vars: {
    uid: printer_1,
    entity_id_prefix: p1s_1,
    ams_id: "1"
  }}

  printer_2_sensors: !include { file: widgets/printers/sensors_core.yaml, vars: {
    uid: printer_2,
    entity_id_prefix: p1s_2
  }}

  printer_2_ams_1_sensors: !include { file: widgets/printers/ams_row.sensors.yaml, vars: {
    uid: printer_2,
    entity_id_prefix: p1s_2,
    ams_id: "1"
  }}

  printer_2_ams_1_humidity: !include { file: widgets/printers/ams_row_humidity.sensors.yaml, vars: {
    uid: printer_2,
    entity_id_prefix: p1s_2,
    ams_id: "1"
  }}

  printer_3_sensors: !include { file: widgets/printers/sensors_core.yaml, vars: {
    uid: printer_3,
    entity_id_prefix: p1s_3
  }}

  printer_3_ams_1_sensors: !include { file: widgets/printers/ams_row.sensors.yaml, vars: {
    uid: printer_3,
    entity_id_prefix: p1s_3,
    ams_id: "1"
  }}

  printer_3_ams_1_humidity: !include { file: widgets/printers/ams_row_humidity.sensors.yaml, vars: {
    uid: printer_3,
    entity_id_prefix: p1s_3,
    ams_id: "1"
  }}

  printer_4_sensors: !include { file: widgets/printers/sensors_core.yaml, vars: {
    uid: printer_4,
    entity_id_prefix: p1s_4
  }}

  printer_4_ams_1_sensors: !include { file: widgets/printers/ams_row.sensors.yaml, vars: {
    uid: printer_4,
    entity_id_prefix: p1s_4,
    ams_id: "1"
  }}

  printer_4_ams_1_humidity: !include { file: widgets/printers/ams_row_humidity.sensors.yaml, vars: {
    uid: printer_4,
    entity_id_prefix: p1s_4,
    ams_id: "1"
  }}

  printer_5_sensors: !include { file: widgets/printers/sensors_core.yaml, vars: {
    uid: printer_5,
    entity_id_prefix: p1s_5
  }}

  printer_5_ams_1_sensors: !include { file: widgets/printers/ams_row.sensors.yaml, vars: {
    uid: printer_5,
    entity_id_prefix: p1s_5,
    ams_id: "1"
  }}

  printer_5_ams_1_humidity: !include { file: widgets/printers/ams_row_humidity.sensors.yaml, vars: {
    uid: printer_5,
    entity_id_prefix: p1s_5,
    ams_id: "1"
  }}

  printer_6_sensors: !include { file: widgets/printers/sensors_core.yaml, vars: {
    uid: printer_6,
    entity_id_prefix: p1s_6
  }}

  printer_6_ams_1_sensors: !include { file: widgets/printers/ams_row.sensors.yaml, vars: {
    uid: printer_6,
    entity_id_prefix: p1s_6,
    ams_id: "1"
  }}

  printer_6_ams_1_humidity: !include { file: widgets/printers/ams_row_humidity.sensors.yaml, vars: {
    uid: printer_6,
    entity_id_prefix: p1s_6,
    ams_id: "1"
  }}
