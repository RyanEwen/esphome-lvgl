esphome:
  includes:
    - widgets/parts/printers/tray_color.h # tray::bg / tray::ink, shared by every tray pill
  # Go home once everything is set up, rather than from splash's on_load: a
  # page.show inside the first page's own load event is dropped, and splash is
  # only the first page while no package adds one ahead of it.
  on_boot:
    - priority: -50 # after layouts/common/page_access.yaml restores the Home page at 0
      then:
        - lambda: id(home_page_restored) = true;
    - priority: -100
      then:
        - script.execute: go_home

substitutions:
  tile_font: roboto_md # the tiles' name font (the shared tile widgets ask for one)
  tile_font_size: 20 # its size (text_md below)

font: !include
  file: fonts/fonts.yaml
  vars:
    text_sm: 16
    text_md: 20
    text_lg: 24
    text_xl: 32
    text_xxl: 48
    icons_sm: 20
    icons_md: 26
    icons_lg: 34
    icons_xl: 42
    icons_xxl: 50

.sizing:
  - &nav_widget_vars
    height: 50
    padding: 8

script:
  # each page's layouts/common/page_access.yaml adds the line that shows it when it's home
  - id: go_home
    then: []

select:
  # Which page is home, from Home Assistant; ${home_page} is the default.
  # Each page's layouts/common/page_access.yaml adds itself to the list.
  - id: home_page_select
    platform: template
    name: Home page
    icon: mdi:home
    entity_category: config
    optimistic: true
    initial_option: ${home_page}
    options: []
    on_value:
      - lambda: |-
          if (id(home_page_restored))
            id(home_page_hash) = fnv1_hash(x);

globals:
  # The select would restore its position in the list, which points at a
  # different page once pages are added or removed. So remember the page's
  # name instead, as a hash, and layouts/common/page_access.yaml puts it back at boot.
  - id: home_page_hash
    type: uint32_t
    restore_value: true
    initial_value: '0'
  - id: home_page_restored # on_value stays quiet until the restore is done
    type: bool
    initial_value: 'false'

lvgl:
  id: main_lvgl # for features that need the LVGL component itself, e.g. sleep_clock
  default_font: roboto_md
  theme: !include themes/main.yaml
  top_layer:
    widgets:
      - <<: !include { file: common/header.yaml, vars: { <<: *nav_widget_vars } }
      - <<: !include { file: common/footer.yaml, vars: { <<: *nav_widget_vars } }
      - <<: !include { file: common/boot_screen.yaml }
  pages:
    - id: splash # blank until on_boot goes home
      skip: true

  # every other page is a package in layouts/480x320/pages/, listed by the
  # top-level config after layout: -- see docs/classic-layouts.md

packages:
  # header
  header: !include { file: common/header.logic.yaml }

  # boot screen
  boot_screen: !include { file: common/boot_screen.logic.yaml }
