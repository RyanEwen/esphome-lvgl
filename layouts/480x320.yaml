font: !include
  file: fonts/fonts.yaml
  vars:
    text_sm: 16
    text_md: 20
    text_lg: 24
    text_xl: 32
    text_xxl: 48
    icons_sm: 20
    icons_md: 26
    icons_lg: 34
    icons_xl: 42
    icons_xxl: 50

.sizing:
  - &nav_widget_vars
    height: 50
    padding: 8

  - &page_styles
    <<: !include styles/page_styles.yaml
    pad_top: 50
    pad_bottom: 50

  - &container_styles
    <<: !include styles/container_styles.yaml
    pad_top: 0
    pad_bottom: 0
    pad_left: 6
    pad_right: 6

  - &button_layout
    <<: !include styles/button_layout.yaml
    pad_column: 8
    pad_row: 8

  - &button_widget_vars
    width: 49%
    height: 86

  - &wide_button_widget_vars
    width: 100%
    height: 86

  - &printer_layout
    <<: !include styles/printer_layout.yaml
    pad_row: 4

  - &printer_tile
    <<: !include styles/printer_tile.yaml
    pad_all: 5

  - &printer_tile_layout
    <<: !include styles/printer_tile_layout.yaml
    pad_row: 3

  - &printer_bar_vars
    bar_height: 4

  - &ams_row_vars
    ams_label_width: 24
    ams_hum_width: 40
    ams_strip_width: 175
    ams_tray_width: 40
    ams_tray_height: 20
    ams_tray_padding: 5

script:
  - id: go_home
    then:
      - lvgl.page.show: ${home_page}

lvgl:
  default_font: roboto_md
  theme: !include themes/main.yaml
  top_layer:
    widgets:
      - <<: !include { file: widgets/header/widget.yaml, vars: { <<: *nav_widget_vars } }
      - <<: !include { file: widgets/footer/widget.yaml, vars: { <<: *nav_widget_vars } }
      - <<: !include { file: widgets/boot_screen/widget.yaml }
  pages:
    - id: splash
      skip: true
      on_load:
        - delay: 250ms # page.show is dropped if called during this on_load
        - script.execute: go_home

    - id: bedroom
      <<: *page_styles
      on_load:
        - lvgl.label.update:
            id: page_title
            text: Bedroom
      widgets:
        - obj:
            <<: *container_styles
            layout:
              <<: *button_layout
            widgets:
              - button: # ceiling light
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml
                    vars:
                      uid: bedroom_light_1
                      entity_id: light.bedroom_light_1
                      text: Ceiling
                      <<: *button_widget_vars

              - button: # volume up
                  <<: !include
                    file: widgets/buttons/icon_buttons/volume_buttons/vol_up.yaml
                    vars:
                      uid: bedroom_tv_vol_up
                      entity_id: media_player.bedroom_android_tv
                      <<: *button_widget_vars

              - button: # rachel light
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml
                    vars:
                      uid: bedroom_light_3
                      entity_id: light.bedroom_light_3
                      text: Rachel
                      <<: *button_widget_vars

              - button: # volume down
                  <<: !include
                    file: widgets/buttons/icon_buttons/volume_buttons/vol_down.yaml
                    vars:
                      uid: bedroom_tv_vol_down
                      entity_id: media_player.bedroom_android_tv
                      <<: *button_widget_vars

              - button: # ryan light
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml
                    vars:
                      uid: bedroom_light_2
                      entity_id: light.bedroom_light_2
                      text: Ryan
                      <<: *button_widget_vars

              - button: # play content
                  <<: !include
                    file: widgets/buttons/text_buttons/stateless.yaml
                    vars:
                      uid: play_content_futurama
                      text: Futurama
                      <<: *button_widget_vars
                  on_short_click:
                    - homeassistant.action:
                        action: script.play_content_on_bedroom_chromecast
                        data: { content: Futurama }
                  on_long_press:
                    - homeassistant.action:
                        action: homeassistant.toggle
                        data: { entity_id: media_player.bedroom_android_tv }

              - button: # play content
                  <<: !include
                    file: widgets/buttons/text_buttons/stateless.yaml
                    vars:
                      uid: play_content_adventure_time
                      text: "Adventure\nTime"
                      <<: *button_widget_vars
                  on_short_click:
                    - homeassistant.action:
                        action: script.play_content_on_bedroom_chromecast
                        data: { content: Adventure Time }
                  on_long_press:
                    - homeassistant.action:
                        action: homeassistant.toggle
                        data: { entity_id: media_player.bedroom_android_tv }

              - button: # play content
                  <<: !include
                    file: widgets/buttons/text_buttons/stateless.yaml
                    vars:
                      uid: play_content_american_dad
                      text: American Dad
                      <<: *button_widget_vars
                  on_short_click:
                    - homeassistant.action:
                        action: script.play_content_on_bedroom_chromecast
                        data: { content: American Dad }
                  on_long_press:
                    - homeassistant.action:
                        action: homeassistant.toggle
                        data: { entity_id: media_player.bedroom_android_tv }

    - id: living_room
      <<: *page_styles
      on_load:
        - lvgl.label.update:
            id: page_title
            text: Living Room
      widgets:
        - obj:
            <<: *container_styles
            layout:
              <<: *button_layout
            widgets:
              - button: # light 1
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml
                    vars:
                      uid: living_room_light_1
                      entity_id: light.living_room_light_1
                      text: Light 1
                      <<: *button_widget_vars

              - button: # light 2
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml
                    vars:
                      uid: living_room_light_2
                      entity_id: light.living_room_light_2
                      text: Light 2
                      <<: *button_widget_vars

              # - button: # dim scene
              #     <<: !include
              #       file: widgets/buttons/text_buttons/stateless.yaml
              #       vars:
              #         uid: dim
              #         text: Dim Lights
              #         <<: *button_widget_vars
              #     on_short_click:
              #       - homeassistant.action:
              #           action: homeassistant.turn_on
              #           data: { entity_id: scene.living_room_lights_tv_watching }
              #     on_long_press:
              #       - homeassistant.action:
              #           action: light.turn_on
              #           data: { entity_id: light.all_living_room_lights, brightness_pct: '100' }

              - button: # tv power
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/stateful.yaml
                    vars:
                      uid: living_room_tv
                      icon_on: "\U000F0425"
                      icon_off: "\U000F0425"
                      text: TV
                      <<: *button_widget_vars
                  on_short_click:
                    - homeassistant.action:
                        action: media_player.toggle
                        data: { entity_id: media_player.living_room_tv }

              - button: # tv power
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/stateful.yaml
                    vars:
                      uid: living_room_xbox
                      icon_on: "\U000F0425"
                      icon_off: "\U000F0425"
                      text: Xbox
                      <<: *button_widget_vars
                  on_short_click:
                    - homeassistant.action:
                        action: media_player.toggle
                        data: { entity_id: media_player.ryan_s_xbox }

              - button: # play / pause
                  <<: !include
                    file: widgets/buttons/icon_buttons/stateless.yaml
                    vars:
                      uid: living_room_tv_playpause
                      icon: "\U000F040E"
                      <<: *button_widget_vars
                  on_short_click:
                    - homeassistant.action:
                        action: media_player.media_play_pause
                        data: { entity_id: media_player.living_room_tv }

              - button: # volume up
                  <<: !include
                    file: widgets/buttons/icon_buttons/volume_buttons/vol_up.yaml
                    vars:
                      uid: living_room_tv_vol_up
                      entity_id: media_player.living_room_tv
                      <<: *button_widget_vars

              - button: # stop
                  <<: !include
                    file: widgets/buttons/icon_buttons/stateless.yaml
                    vars:
                      uid: living_room_tv_stop
                      icon: "\U000F04DB"
                      <<: *button_widget_vars
                  on_short_click:
                    - homeassistant.action:
                        action: media_player.media_stop
                        data: { entity_id: media_player.living_room_tv }

              - button: # volume down
                  <<: !include
                    file: widgets/buttons/icon_buttons/volume_buttons/vol_down.yaml
                    vars:
                      uid: living_room_tv_vol_down
                      entity_id: media_player.living_room_tv
                      <<: *button_widget_vars

    - id: lighting_1
      <<: *page_styles
      on_load:
        - lvgl.label.update:
            id: page_title
            text: Main Floor Lighting
      widgets:
        - obj:
            <<: *container_styles
            layout:
              <<: *button_layout
            widgets:
              - button: # main floor lights
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_group_buttons/widget.yaml
                    vars:
                      uid: main_floor_lights
                      entity_id: light.main_floor_lights
                      text: Main Floor
                      <<: *wide_button_widget_vars

              - button: # living room light
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml
                    vars:
                      uid: all_living_room_lights
                      entity_id: light.all_living_room_lights
                      text: Living Room
                      <<: *button_widget_vars

              - button: # kitchen light
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml
                    vars:
                      uid: kitchen_light
                      entity_id: light.kitchen_light
                      text: Kitchen
                      <<: *button_widget_vars

              - button: # rachel's office light
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml
                    vars:
                      uid: rachels_office_light
                      entity_id: light.rachels_office_light
                      text: Office
                      <<: *button_widget_vars

    - id: lighting_2
      <<: *page_styles
      on_load:
        - lvgl.label.update:
            id: page_title
            text: Second Floor Lighting
      widgets:
        - obj:
            <<: *container_styles
            layout:
              <<: *button_layout
            widgets:
              - button: # second floor lights
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_group_buttons/widget.yaml
                    vars:
                      uid: second_floor_lights
                      entity_id: light.second_floor_lights
                      text: Second Floor
                      <<: *wide_button_widget_vars

              - button: # bedroom lights
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml
                    vars:
                      uid: all_bedroom_lights
                      entity_id: light.all_bedroom_lights
                      text: Bedroom
                      <<: *button_widget_vars

              - button: # railyn light
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml
                    vars:
                      uid: railyns_light
                      entity_id: light.railyns_light
                      text: Railyn
                      <<: *button_widget_vars

              - button: # ryan's office light
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml
                    vars:
                      uid: all_ryan_s_office_lights
                      entity_id: light.all_ryan_s_office_lights
                      text: Office
                      <<: *button_widget_vars

              - button: # upstairs hallway light
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml
                    vars:
                      uid: upstairs_hallway_light
                      entity_id: light.upstairs_hallway_light
                      text: Hallway
                      <<: *button_widget_vars

    - id: lighting_3
      <<: *page_styles
      on_load:
        - lvgl.label.update:
            id: page_title
            text: Outside Lighting
      widgets:
        - obj:
            <<: *container_styles
            layout:
              <<: *button_layout
            widgets:
              - button: # outdoor lights
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_group_buttons/widget.yaml
                    vars:
                      uid: all_outside_lights
                      entity_id: light.all_outside_lights
                      text: Outside Lights
                      <<: *wide_button_widget_vars

              - button: # door lights
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml
                    vars:
                      uid: outside_light_1
                      entity_id: light.outside_light_1
                      text: Door Lights
                      <<: *button_widget_vars

              - button: # deck lights
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml
                    vars:
                      uid: outside_light_2
                      entity_id: light.outside_light_2
                      text: Deck Lights
                      <<: *button_widget_vars

    - id: printers
      <<: *page_styles
      on_load:
        - lvgl.label.update:
            id: page_title
            text: Printers
      widgets:
        - obj:
            <<: *container_styles
            layout:
              <<: *printer_layout
            widgets:
              - obj: # printer 1
                  <<: *printer_tile
                  layout:
                    <<: *printer_tile_layout
                  widgets:
                    - label: # printer name
                        width: 100%
                        height: SIZE_CONTENT
                        text: 1 - Fred
                    - obj: # AMS 1
                        <<: !include { file: widgets/printers/ams_row.yaml, vars: {
                          uid: printer_1, ams_id: "1", label: "1", <<: *ams_row_vars } }
                    - obj: # status / times
                        <<: !include { file: widgets/printers/tile_status.yaml, vars: {
                          uid: printer_1 } }
                    - bar: # print progress
                        <<: !include { file: widgets/printers/tile_progress.yaml, vars: {
                          uid: printer_1, <<: *printer_bar_vars } }

              - obj: # printer 2
                  <<: *printer_tile
                  layout:
                    <<: *printer_tile_layout
                  widgets:
                    - label: # printer name
                        width: 100%
                        height: SIZE_CONTENT
                        text: 2 - Wilma
                    - obj: # AMS 1
                        <<: !include { file: widgets/printers/ams_row.yaml, vars: {
                          uid: printer_2, ams_id: "1", label: "1", <<: *ams_row_vars } }
                    - obj: # status / times
                        <<: !include { file: widgets/printers/tile_status.yaml, vars: {
                          uid: printer_2 } }
                    - bar: # print progress
                        <<: !include { file: widgets/printers/tile_progress.yaml, vars: {
                          uid: printer_2, <<: *printer_bar_vars } }

              - obj: # printer 3
                  <<: *printer_tile
                  layout:
                    <<: *printer_tile_layout
                  widgets:
                    - label: # printer name
                        width: 100%
                        height: SIZE_CONTENT
                        text: 3 - Barney
                    - obj: # AMS 1
                        <<: !include { file: widgets/printers/ams_row.yaml, vars: {
                          uid: printer_3, ams_id: "1", label: "1", <<: *ams_row_vars } }
                    - obj: # status / times
                        <<: !include { file: widgets/printers/tile_status.yaml, vars: {
                          uid: printer_3 } }
                    - bar: # print progress
                        <<: !include { file: widgets/printers/tile_progress.yaml, vars: {
                          uid: printer_3, <<: *printer_bar_vars } }

              - obj: # printer 4
                  <<: *printer_tile
                  layout:
                    <<: *printer_tile_layout
                  widgets:
                    - label: # printer name
                        width: 100%
                        height: SIZE_CONTENT
                        text: 4 - Betty
                    - obj: # AMS 1
                        <<: !include { file: widgets/printers/ams_row.yaml, vars: {
                          uid: printer_4, ams_id: "1", label: "1", <<: *ams_row_vars } }
                    - obj: # status / times
                        <<: !include { file: widgets/printers/tile_status.yaml, vars: {
                          uid: printer_4 } }
                    - bar: # print progress
                        <<: !include { file: widgets/printers/tile_progress.yaml, vars: {
                          uid: printer_4, <<: *printer_bar_vars } }

              - obj: # printer 5
                  <<: *printer_tile
                  layout:
                    <<: *printer_tile_layout
                  widgets:
                    - label: # printer name
                        width: 100%
                        height: SIZE_CONTENT
                        text: 5 - Dinno
                    - obj: # AMS 1
                        <<: !include { file: widgets/printers/ams_row.yaml, vars: {
                          uid: printer_5, ams_id: "1", label: "1", <<: *ams_row_vars } }
                    - obj: # status / times
                        <<: !include { file: widgets/printers/tile_status.yaml, vars: {
                          uid: printer_5 } }
                    - bar: # print progress
                        <<: !include { file: widgets/printers/tile_progress.yaml, vars: {
                          uid: printer_5, <<: *printer_bar_vars } }

              - obj: # printer 6
                  <<: *printer_tile
                  layout:
                    <<: *printer_tile_layout
                  widgets:
                    - label: # printer name
                        width: 100%
                        height: SIZE_CONTENT
                        text: 6 - Pebbles
                    - obj: # AMS 1
                        <<: !include { file: widgets/printers/ams_row.yaml, vars: {
                          uid: printer_6, ams_id: "1", label: "1", <<: *ams_row_vars } }
                    # A printer with more than one AMS gets one more row here,
                    # plus its sensor packages below. An AMS HT is a single-tray
                    # unit, so it uses ams_row_single.yaml:
                    #
                    # - obj: # AMS 2
                    #     <<: !include { file: widgets/printers/ams_row.yaml, vars: {
                    #       uid: printer_6, ams_id: "2", label: "2", <<: *ams_row_vars } }
                    # - obj: # AMS HT
                    #     <<: !include { file: widgets/printers/ams_row_single.yaml, vars: {
                    #       uid: printer_6, ams_id: "128", label: "HT", <<: *ams_row_vars } }
                    - obj: # status / times
                        <<: !include { file: widgets/printers/tile_status.yaml, vars: {
                          uid: printer_6 } }
                    - bar: # print progress
                        <<: !include { file: widgets/printers/tile_progress.yaml, vars: {
                          uid: printer_6, <<: *printer_bar_vars } }

packages:
  # header
  header_sensors: !include { file: widgets/header/sensors.yaml }

  # boot screen
  boot_screen_sensors: !include { file: widgets/boot_screen/sensors.yaml }

  # bedroom
  bedroom_tv_widget_sensors: !include { file: widgets/bedroom_tv.sensor.yaml }

  bedroom_light_1_widget_sensors: !include { file: widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: {
    uid: bedroom_light_1,
    entity_id: light.bedroom_light_1
  }}

  bedroom_light_2_widget_sensors: !include { file: widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: {
    uid: bedroom_light_2,
    entity_id: light.bedroom_light_2
  }}

  bedroom_light_3_widget_sensors: !include { file: widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: {
    uid: bedroom_light_3,
    entity_id: light.bedroom_light_3
  }}

  # living_room
  living_room_light_1_widget_sensors: !include { file: widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: {
    uid: living_room_light_1,
    entity_id: light.living_room_light_1
  }}

  living_room_light_2_widget_sensors: !include { file: widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: {
    uid: living_room_light_2,
    entity_id: light.living_room_light_2
  }}

  living_room_tv_widget_sensors: !include { file: widgets/buttons/icon_buttons/stateful_sensors.yaml, vars: {
    uid: living_room_tv,
    entity_id: media_player.living_room_tv
  }}

  living_room_xbox_widget_sensors: !include { file: widgets/buttons/icon_buttons/stateful_sensors.yaml, vars: {
    uid: living_room_xbox,
    entity_id: media_player.ryan_s_xbox
  }}

  living_room_tv_extra_widgets_sensors: !include { file: widgets/living_room_tv.sensor.yaml }

  # lighting 1
  main_floor_lights_widget_sensors: !include { file: widgets/buttons/icon_text_buttons/light_group_buttons/sensors.yaml, vars: {
    uid: main_floor_lights,
    entity_id: light.main_floor_lights
  }}

  all_living_room_lights_widget_sensors: !include { file: widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: {
    uid: all_living_room_lights,
    entity_id: light.all_living_room_lights
  }}

  kitchen_light_widget_sensors: !include { file: widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: {
    uid: kitchen_light,
    entity_id: light.kitchen_light
  }}

  rachels_office_light_widget_sensors: !include { file: widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: {
    uid: rachels_office_light,
    entity_id: light.rachels_office_light
  }}

  # lighting 2
  second_floor_lights_widget_sensors: !include { file: widgets/buttons/icon_text_buttons/light_group_buttons/sensors.yaml, vars: {
    uid: second_floor_lights,
    entity_id: light.second_floor_lights
  }}

  all_bedroom_lights_widget_sensors: !include { file: widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: {
    uid: all_bedroom_lights,
    entity_id: light.all_bedroom_lights
  }}

  railyns_light_widget_sensors: !include { file: widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: {
    uid: railyns_light,
    entity_id: light.railyns_light
  }}

  ryans_office_light_widget_sensors: !include { file: widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: {
    uid: all_ryan_s_office_lights,
    entity_id: light.all_ryan_s_office_lights
  }}

  upstairs_hallway_light_widget_sensors: !include { file: widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: {
    uid: upstairs_hallway_light,
    entity_id: light.upstairs_hallway_light
  }}

  # lighting 3
  all_outside_lights_widget_sensors: !include { file: widgets/buttons/icon_text_buttons/light_group_buttons/sensors.yaml, vars: {
    uid: all_outside_lights,
    entity_id: light.all_outside_lights
  }}

  outside_light_1_widget_sensors: !include { file: widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: {
    uid: outside_light_1,
    entity_id: light.outside_light_1
  }}

  outside_light_2_widget_sensors: !include { file: widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: {
    uid: outside_light_2,
    entity_id: light.outside_light_2
  }}

  # printers
  # One sensors_core package per printer, then per AMS unit: an ams_row.sensors
  # package (or ams_row_single.sensors for an AMS HT), an ams_row_humidity
  # package, and -- only for a unit with drying hardware -- an ams_row_drying
  # package. Drying belongs to the unit rather than to the printer, so if a unit
  # moves to another machine its packages move with it, under the new prefix.

  printer_1_sensors: !include { file: widgets/printers/sensors_core.yaml, vars: {
    uid: printer_1,
    entity_id_prefix: p1s_1
  }}

  printer_1_ams_1_sensors: !include { file: widgets/printers/ams_row.sensors.yaml, vars: {
    uid: printer_1,
    entity_id_prefix: p1s_1,
    ams_id: "1"
  }}

  printer_1_ams_1_humidity: !include { file: widgets/printers/ams_row_humidity.sensors.yaml, vars: {
    uid: printer_1,
    entity_id_prefix: p1s_1,
    ams_id: "1"
  }}

  printer_2_sensors: !include { file: widgets/printers/sensors_core.yaml, vars: {
    uid: printer_2,
    entity_id_prefix: p1s_2
  }}

  printer_2_ams_1_sensors: !include { file: widgets/printers/ams_row.sensors.yaml, vars: {
    uid: printer_2,
    entity_id_prefix: p1s_2,
    ams_id: "1"
  }}

  printer_2_ams_1_humidity: !include { file: widgets/printers/ams_row_humidity.sensors.yaml, vars: {
    uid: printer_2,
    entity_id_prefix: p1s_2,
    ams_id: "1"
  }}

  printer_3_sensors: !include { file: widgets/printers/sensors_core.yaml, vars: {
    uid: printer_3,
