esphome:
  min_version: 2026.9.0

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

web_server:
  port: 80

ota:
  - platform: esphome
    encryption: # inherits the api key

api:
  encryption:
    key: !secret api_encryption_key
  on_client_connected:
    - globals.set:
        id: homeassistant_ip
        value: !lambda return client_address;

button:
  - platform: restart
    name: Restart

binary_sensor:
  - platform: status
    name: Status

# Always on, because the evidence for an unexplained restart can only be caught
# at the boot that follows it: uptime shows that one happened, reset reason says
# why (a crash, a watchdog, or the 15-minute api/wifi reboot_timeout, which
# reads as a software reset). The memory sensors for chasing one down are
# opt-in: features/diagnostics/.
debug:
  update_interval: 60s

sensor:
  # the boot time, published once at the first clock sync, rather than a
  # seconds count every minute -- a restart shows as a jump, and it costs the
  # recorder one row per boot
  - platform: uptime
    type: timestamp
    name: Uptime

  - id: wifi_signal_db
    name: WiFi Signal
    platform: wifi_signal
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: debug
    reset_reason:
      name: Reset Reason
  - platform: wifi_info
    ip_address:
      name: IP Address
      entity_category: diagnostic
    ssid:
      name: Connected SSID
      entity_category: diagnostic
    mac_address:
      name: Mac Address
      entity_category: diagnostic

globals:
  - id: homeassistant_ip
    type: std::string
